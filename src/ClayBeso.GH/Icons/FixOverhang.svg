<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!-- original overhanging wall (dashed) -->
  <path d="M 6 21.5 C 6 15 1.5 11 2.5 5" fill="none" stroke="#C8643C" stroke-width="1.1" stroke-dasharray="1.6 1.2" stroke-linecap="round"/>
  <!-- corrected, printable wall -->
  <path d="M 6 21.5 C 6 16 5.2 11 6.8 5" fill="none" stroke="#3B2A22" stroke-width="1.6" stroke-linecap="round"/>
  <!-- arrow pulling the wall back -->
  <path d="M 2.6 11.5 L 5.2 11.5" stroke="#3B2A22" stroke-width="1.1" stroke-linecap="round"/>
  <path d="M 4.4 10.3 L 5.6 11.5 L 4.4 12.7" fill="none" stroke="#3B2A22" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 45 degree limit -->
  <path d="M 6 21.5 L 19.5 8" stroke="#8A7A70" stroke-width="0.9" stroke-dasharray="1.4 1.1"/>
  <path d="M 11.5 21.5 A 5.5 5.5 0 0 0 9.9 17.6" fill="none" stroke="#8A7A70" stroke-width="0.9"/>
  <!-- bed -->
  <path d="M 1.5 21.8 H 22.5" stroke="#3B2A22" stroke-width="1.2" stroke-linecap="round"/>
  <!-- tick: printable -->
  <circle cx="18.6" cy="5.4" r="4.2" fill="#5A8F4E"/>
  <path d="M 16.6 5.5 L 18.1 7.0 L 20.7 4.0" fill="none" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
